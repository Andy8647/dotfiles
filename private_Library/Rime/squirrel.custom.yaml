# Catppuccin Latte(浅色) / Mocha(深色) + 加粗 + 横向
patch:
  style:
    color_scheme: catppuccin_latte
    color_scheme_dark: catppuccin_mocha

    # 横向排列
    candidate_list_layout: linear
    text_orientation: horizontal

    # 拼音显示在光标处(行内)，候选框只显示候选词，不折行
    inline_preedit: true

    # 贴边不跳
    memorize_size: true

    # 候选格式
    candidate_format: "%c %@"

    # 字体加粗
    font_face: "Maple Mono NF CN SemiBold"
    font_point: 15
    label_font_point: 13

    # 圆角
    corner_radius: 6
    hilited_corner_radius: 4

    border_height: 0
    border_width: 0

  preset_color_schemes:
    catppuccin_mocha:
      name: Catppuccin Mocha
      back_color: 0x2E1E1E
      border_color: 0x342424
      text_color: 0xD0C8C6
      hilited_text_color: 0xF5F0ED
      hilited_back_color: 0x403030
      label_color: 0x908080
      candidate_text_color: 0xF0EBE8
      hilited_candidate_text_color: 0x2E1E1E
      hilited_candidate_back_color: 0xF0C0A0
      hilited_candidate_label_color: 0x604040
      comment_text_color: 0x908080
      hilited_comment_text_color: 0x605050

    catppuccin_latte:
      name: Catppuccin Latte
      back_color: 0xE8E0DC
      border_color: 0xEFE9E6
      text_color: 0x775F5C
      hilited_text_color: 0xBEB0AC
      hilited_back_color: 0xEF3988
      label_color: 0x856F6C
      candidate_text_color: 0x694F4C
      hilited_candidate_text_color: 0xF5F1EF
      hilited_candidate_back_color: 0xEF3988
      hilited_candidate_label_color: 0xDAD0CC
      comment_text_color: 0xBEB0AC
      hilited_comment_text_color: 0xDAD0CC

    catppuccin_macchiato:
      name: Catppuccin Macchiato
      back_color: 0x3A2724
      border_color: 0x40302E
      text_color: 0xC8B8B0
      hilited_text_color: 0xEAE0D8
      hilited_back_color: 0x4A3835
      label_color: 0x988880
      candidate_text_color: 0xE8E0D8
      hilited_candidate_text_color: 0x3A2724
      hilited_candidate_back_color: 0xE8C0A0
      hilited_candidate_label_color: 0x685048
      comment_text_color: 0x988880
      hilited_comment_text_color: 0x685048

[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
# 三栏比例: [父目录, 当前目录, 预览]。加大最后一个让预览更宽
ratio = [1, 3, 5]

[preview]
max_width = 1000
max_height = 1000

[plugin]
prepend_previewers = [
]

[flavor]
use = "catppuccin-mocha"

[opener]
word = [
  { run = 'open -a "Microsoft Word" %s', desc = "Microsoft Word", orphan = true },
]
csvlens = [
  { run = 'csvlens --color-columns %s1', desc = "csvlens", block = true },
]
csvlens-tsv = [
  { run = 'csvlens --color-columns -t %s1', desc = "csvlens (tab-separated)", block = true },
]

[open]
prepend_rules = [
  { url = "*.csv", use = "csvlens" },
  { url = "*.tsv", use = "csvlens-tsv" },
  { url = "*.docx", use = "word" },
  { url = "*.doc", use = "word" },
]
